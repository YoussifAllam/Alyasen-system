networks:
  factory_sys_backend:
    driver: bridge

volumes:
  factory_sys_django_db_data: {}
  factory_sys_media_data: {}
  factory_sys_static_vol: {}
  factory_sys_redis_data: {}

services:

  factory_sys_django:
    build:
      context: ..
      dockerfile: Docker/Dockerfile
    container_name: factory_sys_app
    command: uvicorn config.asgi:application --host 0.0.0.0 --port 8000
    restart: always
    volumes:
      - ..:/code
      - factory_sys_media_data:/code/media
      - factory_sys_django_db_data:/code/Docker/volumes/db_volume
      - factory_sys_static_vol:/code/staticfiles
    env_file:
      - ../ENV/.env.test
    environment:
      - ENVIRONMENT=test
      - DJANGO_SETTINGS_MODULE=config.django
      - PYTHONUNBUFFERED=1
      - PYTHONDONTWRITEBYTECODE=1
    depends_on:
      - factory_sys_redis
    networks:
      - factory_sys_backend

  factory_sys_redis:
    container_name: factory_sys_redis
    image: redis:latest
    command: redis-server --appendonly yes --save 60 1 --loglevel warning
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 3
    volumes:
      - factory_sys_redis_data:/data
    networks:
      - factory_sys_backend

  factory_sys_celery:
    build:
      context: ..
      dockerfile: Docker/Dockerfile
    container_name: factory_sys_celery
    command: celery -A config.settings.celery worker -l info
    volumes:
      - ..:/code
      - ./code/db:/code/Docker/volumes/celery_db
    env_file:
      - ../ENV/.env.test
    environment:
      - DJANGO_SETTINGS_MODULE=config.django
      - ENVIRONMENT=test
    depends_on:
      - factory_sys_redis
    networks:
      - factory_sys_backend

  factory_sys_celery_beat:
    build:
      context: ..
      dockerfile: Docker/Dockerfile
    container_name: factory_sys_celery_beat
    command: celery -A config.settings.celery beat -l info
    volumes:
      - ..:/code
      - ./code/db:/code/Docker/volumes/celery_db
    env_file:
      - ../ENV/.env.test
    environment:
      - DJANGO_SETTINGS_MODULE=config.django
      - ENVIRONMENT=test
    depends_on:
      - factory_sys_redis
    networks:
      - factory_sys_backend

  factory_sys_nginx:
    build: ../nginx/test_nginx
    volumes:
      - factory_sys_static_vol:/code/staticfiles
      - factory_sys_media_data:/code/media
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /var/lib/letsencrypt:/var/lib/letsencrypt:ro
    ports:
      - "80:80"
      - "9444:443"
    depends_on:
      - factory_sys_django
    networks:
      - factory_sys_backend